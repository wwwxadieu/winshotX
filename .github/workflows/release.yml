name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver, e.g. 0.1.0) — used when triggering manually instead of by pushing a tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Derive version and tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Khi chạy thủ công (workflow_dispatch) chưa có sẵn tag git — tạo và push ngay tại đây bằng
      # GITHUB_TOKEN của chính workflow (đủ quyền contents:write) thay vì yêu cầu người gọi phải push
      # tag từ máy cá nhân trước.
      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Win ShootX ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Restore
        run: dotnet restore src/WinShootX.sln

      - name: Publish (win-x64)
        run: >
          dotnet publish src/WinShootX/WinShootX.csproj -c Release -r win-x64
          --self-contained true -o publish/win-x64
          -p:Version=${{ steps.version.outputs.version }}

      - name: Generate UI demo screenshots
        run: |
          $proc = Start-Process -FilePath "publish\win-x64\WinShootX.exe" -ArgumentList "--screenshot-demo","screenshots" -PassThru
          $proc.WaitForExit(60000) | Out-Null
          if (-not (Test-Path "screenshots\06-recording.png")) {
            throw "Screenshot generation did not produce the expected output files."
          }
        shell: pwsh

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.0

      - name: Fetch previous release (for delta updates)
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Ký code cho installer/exe — CHỈ chạy khi đã cấu hình 2 secret WINDOWS_PFX_BASE64 (nội dung
      # file .pfx encode base64) và WINDOWS_PFX_PASSWORD trong Settings → Secrets and variables →
      # Actions của repo. Chưa cấu hình thì bước này tự bỏ qua và release vẫn ra bình thường (chưa ký
      # — Windows SmartScreen sẽ cảnh báo khi cài cho tới khi thêm cert thật). Dùng --signParams của
      # vpk (gọi signtool.exe nội bộ) — xem https://docs.velopack.io/packaging/signing. Chưa có cert
      # thật để thử end-to-end trong phiên làm việc này nên cú pháp bám sát tài liệu chính thức, cần
      # người có cert xác nhận lại lần ký đầu tiên.
      - name: Pack Velopack release
        shell: bash
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          sign_args=()
          cert_path=""
          if [ -n "$PFX_BASE64" ]; then
            cert_path="$RUNNER_TEMP/winshootx-signing.pfx"
            echo "$PFX_BASE64" | base64 -d > "$cert_path"
            cert_path_win=$(cygpath -w "$cert_path")
            sign_args=(--signParams "/td sha256 /fd sha256 /f \"$cert_path_win\" /p \"$PFX_PASSWORD\" /tr http://timestamp.digicert.com")
            echo "Code signing enabled (WINDOWS_PFX_BASE64 secret found)."
          else
            echo "Code signing skipped — no WINDOWS_PFX_BASE64 secret configured."
          fi

          # --msi --instLocation Either: đóng gói thêm 1 bản .msi (dùng WiX) bên cạnh Setup.exe mặc
          # định — Setup.exe cố định cài vào %LocalAppData%\WinShootX không hỏi gì (đánh đổi để
          # auto-update chạy mượt, xem docs.velopack.io/packaging/installer), còn .msi cho người dùng
          # chọn nơi cài (per-user/per-machine) qua trình cài đặt Windows Installer chuẩn.
          vpk pack --packId WinShootX --packVersion "${{ steps.version.outputs.version }}" \
            --packDir publish/win-x64 --mainExe WinShootX.exe \
            --packTitle "Win ShootX" --icon src/WinShootX/Assets/app.ico \
            --outputDir releases \
            --msi --instLocation Either \
            "${sign_args[@]}"

          if [ -n "$cert_path" ]; then rm -f "$cert_path"; fi

      - name: Publish to GitHub Releases
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish
          --releaseName "Win ShootX ${{ steps.version.outputs.version }}"
          --tag ${{ steps.version.outputs.tag }}

      - name: Attach UI demo screenshots to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.version.outputs.tag }}" screenshots/*.png --clobber
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: winshotx-screenshots
          path: screenshots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: winshotx-releases
          path: releases/**
