name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (semver, e.g. 0.1.0) — used when triggering manually instead of by pushing a tag"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Derive version and tag
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      # Khi chạy thủ công (workflow_dispatch) chưa có sẵn tag git — tạo và push ngay tại đây bằng
      # GITHUB_TOKEN của chính workflow (đủ quyền contents:write) thay vì yêu cầu người gọi phải push
      # tag từ máy cá nhân trước.
      - name: Create and push release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Win ShootX ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Restore
        run: dotnet restore src/WinShootX.sln

      - name: Publish (win-x64)
        run: >
          dotnet publish src/WinShootX/WinShootX.csproj -c Release -r win-x64
          --self-contained true -o publish/win-x64
          -p:Version=${{ steps.version.outputs.version }}

      - name: Generate UI demo screenshots
        # Chạy chính app đã build (không phải mock) với dữ liệu mẫu, chụp lại các cửa sổ chính ra PNG.
        # Chạy được vì windows-latest có desktop tương tác thật (Session 1), không phải headless.
        run: |
          $proc = Start-Process -FilePath "publish\win-x64\WinShootX.exe" -ArgumentList "--screenshot-demo","screenshots" -PassThru
          $proc.WaitForExit(60000) | Out-Null
          if (-not (Test-Path "screenshots\06-recording.png")) {
            throw "Screenshot generation did not produce the expected output files."
          }
        shell: pwsh

      # Đóng gói bằng Inno Setup (có sẵn trên windows-latest, không cần cài thêm) thay cho Velopack —
      # cho người dùng chọn thư mục cài qua nút Browse... trong wizard, điều Velopack (cả Setup.exe
      # lẫn .msi) không hỗ trợ. Tên file output CỐ ĐỊNH (WinShootX-Setup.exe, không kèm số bản) vì
      # Services/AppUpdateService.cs trong app dựa vào đúng tên này để tìm bản cài đặt mới nhất khi
      # tự kiểm tra cập nhật — đổi tên ở đây thì phải đổi InstallerAssetName trong service tương ứng.
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\WinShootX.iss /DMyAppVersion=${{ steps.version.outputs.version }}
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path "installer-output\WinShootX-Setup.exe")) { throw "Installer output not found." }

      # Ký code cho installer — CHỈ chạy khi đã cấu hình 2 secret WINDOWS_PFX_BASE64 (nội dung file
      # .pfx encode base64) và WINDOWS_PFX_PASSWORD trong Settings → Secrets and variables → Actions
      # của repo. Chưa cấu hình thì bước này tự bỏ qua, release vẫn ra bình thường (chưa ký — Windows
      # SmartScreen sẽ cảnh báo khi cài cho tới khi có cert thật). signtool.exe có sẵn trong Windows
      # SDK đã cài trên windows-latest — dò đường dẫn thay vì hardcode vì số hiệu bản SDK có thể đổi
      # giữa các lần cập nhật runner image. Chưa có cert thật để thử end-to-end trong phiên làm việc
      # tạo ra bước này — cần xác nhận lại ở lần ký đầu tiên.
      - name: Sign installer (optional)
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:PFX_BASE64) {
            Write-Host "Code signing skipped — no WINDOWS_PFX_BASE64 secret configured."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "winshootx-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:PFX_BASE64))

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found on this runner." }

          & $signtool.FullName sign /f $certPath /p $env:PFX_PASSWORD /fd sha256 /td sha256 /tr http://timestamp.digicert.com "installer-output\WinShootX-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed with exit code $LASTEXITCODE" }

          Remove-Item $certPath -Force
          Write-Host "Code signing applied (WINDOWS_PFX_BASE64 secret found)."

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "installer-output/WinShootX-Setup.exe" \
            screenshots/*.png \
            --title "Win ShootX ${{ steps.version.outputs.version }}" \
            --notes "Win ShootX ${{ steps.version.outputs.version }}. Chạy WinShootX-Setup.exe để cài đặt — installer cho chọn thư mục cài qua nút Browse."

      - uses: actions/upload-artifact@v4
        with:
          name: winshotx-screenshots
          path: screenshots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: winshotx-installer
          path: installer-output/*.exe
